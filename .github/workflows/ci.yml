# SPDX-License-Identifier: MIT

# Builds ntdlib on its own whenever main changes: on Windows x64 with clang-cl, and on macOS ARM64. The Windows job
# also builds ntdlib::sequence_export (NTDLIB_SEQUENCE_EXPORT=ON) and runs ctest, the export's tests included. The
# macOS job builds without the tests (NTDLIB_TESTS=OFF). Changes to documentation alone don't start a run.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (clang-cl)
            os: windows-2025
            cmake: -A x64 -T ClangCL -DNTDLIB_SEQUENCE_EXPORT=ON
            tests: true
            timeout: 45
          - name: macOS ARM64 (Apple Clang)
            os: macos-15
            cmake: -DNTDLIB_TESTS=OFF
            timeout: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        if: matrix.tests
        run: ctest --test-dir build --build-config Release --output-on-failure --parallel 4
